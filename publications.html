<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publications</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lora:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .publications {
            margin-top: 20px;
            text-align: center;
        }
        .publications ul {
            text-align: left;
            display: inline-block;
            width: 80%;
        }
        .publications li {
            margin-bottom: 15px;
            font-family: 'Roboto', sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }
        .publications li .title {
            font-weight: bold;
        }
        .publications li .journal {
            font-style: italic;
        }
        .publications li .status {
            color: #555;
        }
        .publications li a {
            color: #1e90ff;
            text-decoration: none;
        }
        .publications li a:hover {
            text-decoration: underline;
        }
        #pub-list {
            margin-top: 10px;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <h1>My Publication</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="news.html">News</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="research.html">Research</a></li>
                <li><a href="publications.html" class="active">Publications</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <h2 style="text-align: center;">Publications</h2>
        <div class="publications">
            <div id="pub-list" class="loading">Loading publications from Google Scholar...</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Tingpeng Zhang</p>
    </footer>

    <script>
        // Google Scholar 用户ID（从您的链接中提取）
        const userId = '_vgmAQMAAAAJ';
        
        // 异步加载出版物
        async function loadPublications() {
            const pubList = document.getElementById('pub-list');
            try {
                // 从 Google Scholar API 抓取数据（公开端点）
                const response = await fetch(`https://scholar.google.com/citations?user=${userId}&hl=en&oi=bibs`);
                if (!response.ok) throw new Error('Failed to fetch');
                
                // 解析 JSON（Scholar 返回 JSONP，但我们用简单方式处理；实际中可优化）
                const text = await response.text();
                // 提取 JSON 部分（Scholar 的响应是 JSONP 包裹的 JSON）
                const jsonMatch = text.match(/window\.GLOBAL_CONFIG\s*=\s*({.*?});/);
                if (!jsonMatch) throw new Error('Invalid response format');
                
                const data = JSON.parse(jsonMatch[1]);
                const pubs = data.cites || []; // 出版物数组
                
                if (pubs.length === 0) {
                    pubList.innerHTML = '<p>No publications found.</p>';
                    return;
                }
                
                // 生成 HTML 列表
                let html = '<ul>';
                pubs.slice(0, 20).forEach(pub => { // 限制前20篇
                    const title = pub.title || 'Untitled';
                    const authors = pub.authors || 'Unknown authors';
                    const journal = pub.publication || 'Unknown journal';
                    const year = pub.year || 'N/A';
                    const citations = pub.num_citations || 0;
                    const link = pub.citation_id ? `https://scholar.google.com/citations?view_op=view_citation&hl=en&user=${userId}&citation_for_view=${userId}:${pub.citation_id}` : '#';
                    
                    html += `
                        <li>
                            <a href="${link}" class="title" target="_blank">${title}</a><br>
                            <span class="authors">${authors}</span><br>
                            <span class="journal">${journal}</span>, ${year}<br>
                            <span class="status">Citations: ${citations}</span>
                        </li>
                    `;
                });
                html += '</ul>';
                
                pubList.innerHTML = html;
            } catch (error) {
                console.error('Error loading publications:', error);
                pubList.innerHTML = '<p>Error loading publications. Please refresh or check console.</p>';
            }
        }
        
        // 页面加载完成后执行
        window.addEventListener('load', loadPublications);
    </script>
</body>
</html>
